  <rect x="24" y="24" width="812" height="492" rx="14" fill="#fff" stroke="#e7e9ee"/>
  <text x="52" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#7d8490">DSH Web 工作区（示意）</text>
  <rect x="52" y="94" width="470" height="16" rx="8" fill="#eef0f3"/>
  <rect x="52" y="124" width="620" height="16" rx="8" fill="#f1f2f4"/>
  <rect x="52" y="154" width="390" height="16" rx="8" fill="#f1f2f4"/>
  <circle cx="768" cy="452" r="33" fill="#202124"/>
  <path d="M753 454c0-11 8-19 19-19s19 8 19 19-8 19-19 19c-4 0-8-1-11-3l-8 3 3-8c-2-3-3-7-3-11Z" fill="#fff"/>
  <rect x="344" y="102" width="440" height="316" rx="16" fill="#fff" stroke="#dfe2e8"/>
  <text x="372" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="600" fill="#202124">辅助 Chat</text>
  <text x="744" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#8b919b">×</text>
  <rect x="372" y="164" width="208" height="54" rx="14" fill="#f0f1f3"/>
  <text x="390" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#41464e">帮我总结这段内容</text>
  <rect x="502" y="232" width="254" height="76" rx="14" fill="#202124"/>
  <text x="522" y="259" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#fff">可以。我会提炼重点并</text>
